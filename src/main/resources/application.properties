spring.application.name=placement-system

spring.datasource.url=jdbc:mysql://localhost:3306/placement_system
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
#noinspection SpringBootApplicationProperties
app.jwt.secret=${JWT_SECRET} 
#noinspection SpringBootApplicationProperties
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
#noinspection SpringBootApplicationProperties
app.jwt.cookie-secure=${AUTH_COOKIE_SECURE:false}